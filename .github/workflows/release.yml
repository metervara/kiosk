name: Publish GitHub release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: macos-15
    timeout-minutes: 50
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        run: ./scripts/version.sh --check-tag "$RELEASE_TAG"

      - name: Build universal app and package download
        run: ./scripts/package-release.sh "$RELEASE_TAG"

      - name: Publish release with completed downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ARCHIVE="dist/Kiosk-${RELEASE_TAG#v}-macos-universal.zip"
          if gh release view "$RELEASE_TAG" --json isDraft,body > "$RUNNER_TEMP/kiosk-release.json" 2>/dev/null; then
            if [ "$(/usr/bin/plutil -extract isDraft raw -o - "$RUNNER_TEMP/kiosk-release.json")" != true ]; then
              echo "This release is already published. Create a new version instead of replacing its downloads." >&2
              exit 1
            fi
            python3 scripts/refresh-release-notes.py "$RUNNER_TEMP/kiosk-release.json" \
              dist/release-notes.md "$RUNNER_TEMP/kiosk-release-notes.md"
            gh release upload "$RELEASE_TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
            gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/kiosk-release-notes.md"
          else
            RELEASE_OPTIONS=(--draft --verify-tag --title "Kiosk $RELEASE_TAG" --generate-notes --notes-file dist/release-notes.md)
            if [[ "$RELEASE_TAG" == *-* ]]; then RELEASE_OPTIONS+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "$ARCHIVE" "$ARCHIVE.sha256" "${RELEASE_OPTIONS[@]}"
          fi
          gh release edit "$RELEASE_TAG" --draft=false
